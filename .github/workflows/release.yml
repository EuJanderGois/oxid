name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            archive: zip
            binary: oxid.exe
            artifact: oxid-windows-x86_64

          - name: Linux
            os: ubuntu-latest
            archive: tar.gz
            binary: oxid
            artifact: oxid-linux-x86_64

          - name: macOS
            os: macos-latest
            archive: tar.gz
            binary: oxid
            artifact: oxid-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Verify tag is on main
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git fetch origin main

          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in main."
            echo "Releases must originate from main."
            exit 1
          fi

          echo "Release commit: $TAG_COMMIT"
          echo "Main HEAD: $MAIN_COMMIT"

      - name: Verify tag matches Cargo version
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)."
            exit 1
          fi

      - name: Build
        run: cargo build --release

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "installer\windows\oxid.iss"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $package = "oxid-v$version-windows-x86_64"

          New-Item -ItemType Directory -Force -Path "release/$package" | Out-Null
          Copy-Item "target/release/oxid.exe" "release/$package/oxid.exe"

          Compress-Archive `
            -Path "release/$package/*" `
            -DestinationPath "release/$package.zip"

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="oxid-v${VERSION}-${{ matrix.name == 'Linux' && 'linux' || 'macos' }}-x86_64"

          mkdir -p "release/$PACKAGE"
          cp "target/release/oxid" "release/$PACKAGE/oxid"

          tar -czf "release/$PACKAGE.tar.gz" -C "release" "$PACKAGE"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List release files
        run: |
          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.zip
            release/**/*.tar.gz