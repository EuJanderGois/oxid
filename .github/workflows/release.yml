name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main

          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in main."
            echo "Releases must originate from main."
            exit 1
          fi

          echo "Release commit: $TAG_COMMIT"
          echo "Main HEAD: $MAIN_COMMIT"

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)."
            exit 1
          fi

      - name: Build
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true